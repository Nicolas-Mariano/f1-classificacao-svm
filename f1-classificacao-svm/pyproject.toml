[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-classificacao-svm"
version = "1.0.0"
description = "Classificação de resultados da Fórmula 1 com Support Vector Classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ana Raquel da Silva Correia" },
    { name = "Nicolas Mariano de Azevedo" },
]
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
